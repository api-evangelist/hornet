name: Hornet
description: >-
  Hornet is a queer social networking platform operated by Queer Networks, Inc., serving
  the global LGBTQ+ community with more than 100 million users worldwide. The Hornet app
  combines profiles, feeds, live video, one-on-one video chat, messaging, and location-based
  discovery into a privacy-first digital home for gay men and the broader queer community.
  Backed by 500 Global (and previously part of BlueCity Holdings), Hornet operates as a
  consumer social/media company rather than an API provider — it publishes no public
  developer API, OpenAPI, or SDKs — so this API Evangelist profile captures the company's
  public identity, policy surface, and domain-security posture rather than developer
  artifacts. Hornet is number one in several key markets including France, Brazil, Turkey,
  and Taiwan, and monetizes through premium subscriptions and queer-audience advertising.
